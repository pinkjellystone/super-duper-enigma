<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="创作追踪">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="创作追踪">
<meta name="theme-color" content="#2D2A4A">
<meta name="description" content="30天创作追踪工作台">
<meta name="format-detection" content="telephone=no">
<title>30天创作追踪工作台</title>
<link rel="apple-touch-icon" id="appleTouchIcon" href="">
<link rel="icon" type="image/svg+xml" id="svgIcon" href="">
<link rel="mask-icon" id="maskIcon" href="" color="#6C5CE7">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#6C5CE7;--primary-light:#A29BFE;--primary-dark:#5547B8;
  --accent:#00CEC9;--success:#00B894;--warning:#FDCB6E;--danger:#FF7675;
  --bg:#F8F9FD;--bg-card:#fff;--bg-sidebar:#2D2A4A;--bg-sidebar-hover:#3D3A5A;
  --text:#2D3436;--text-light:#636E72;--text-sidebar:#DFE0F0;--text-sidebar-active:#fff;
  --border:#E9ECF0;--shadow:0 2px 12px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --radius:14px;--radius-sm:8px;--sidebar-w:240px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;overflow-x:hidden}
.sidebar{width:var(--sidebar-w);background:var(--bg-sidebar);color:var(--text-sidebar);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:1000;transition:transform .3s;overflow-y:auto}
.sidebar-header{padding:20px 16px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-header h1{font-size:1.15rem;color:#fff;font-weight:700}
.sidebar-header .subtitle{font-size:.75rem;opacity:.6;margin-top:4px}
.sidebar-header .cycle-info{margin-top:10px;font-size:.72rem;background:rgba(255,255,255,.1);border-radius:6px;padding:4px 8px;display:inline-block}
.sidebar-nav{flex:1;padding:12px 8px;list-style:none}
.sidebar-nav li{margin-bottom:2px}
.sidebar-nav li a{display:flex;align-items:center;gap:10px;padding:12px 14px;color:var(--text-sidebar);text-decoration:none;border-radius:var(--radius-sm);font-size:.9rem;cursor:pointer;transition:all .2s;user-select:none}
.sidebar-nav li a:hover{background:var(--bg-sidebar-hover)}
.sidebar-nav li a.active{background:var(--primary);color:var(--text-sidebar-active);font-weight:600}
.sidebar-nav li a .icon{font-size:1.2rem;width:24px;text-align:center}
.sidebar-footer{padding:12px 16px;font-size:.7rem;opacity:.5;text-align:center;border-top:1px solid rgba(255,255,255,.08)}
.main-content{flex:1;margin-left:var(--sidebar-w);min-height:100vh;transition:margin .3s;display:flex;flex-direction:column}
.mobile-topbar{display:none;position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg-sidebar);color:#fff;z-index:999;align-items:center;padding:0 12px;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.mobile-topbar .menu-btn{background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;padding:6px;line-height:1}
.mobile-topbar .topbar-title{font-size:1rem;font-weight:600;flex:1}
.page-container{padding:24px;max-width:1100px;margin:0 auto;width:100%}
.card{background:var(--bg-card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:1.1rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-title .badge{font-size:.7rem;background:var(--primary-light);color:#fff;padding:2px 8px;border-radius:10px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:.88rem;cursor:pointer;transition:all .2s;font-family:var(--font)}
.btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-success{background:var(--success)}.btn-success:hover{background:#009B7D}
.btn-danger{background:var(--danger)}.btn-danger:hover{background:#E55C5C}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--primary);color:var(--primary);background:transparent}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-lg{padding:12px 28px;font-size:1rem}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);background:#F7F8FC;margin-bottom:6px;transition:all .2s;cursor:pointer}
.check-item:hover{background:#EFF1F8}
.check-item .checkbox{width:20px;height:20px;border:2px solid var(--border);border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;background:#fff}
.check-item.done .checkbox{background:var(--success);border-color:var(--success)}
.check-item.done .checkbox::after{content:'✓';color:#fff;font-size:.85rem;font-weight:700}
.check-item.done .item-text{text-decoration:line-through;color:var(--text-light)}
/* 顺延任务折叠区 */
.carry-details{margin:14px 0 8px;border:1px solid #FFE0B2;border-radius:var(--radius-sm);background:#FFFCF7;overflow:hidden}
.carry-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;font-size:.82rem;font-weight:700;color:var(--warning);cursor:pointer;user-select:none;list-style:none}
.carry-summary::-webkit-details-marker{display:none}
.carry-summary::before{content:'▸';margin-right:6px;transition:transform .2s;display:inline-block;font-size:.7rem}
.carry-details[open] .carry-summary::before{transform:rotate(90deg)}
.carry-count{font-size:.72rem;font-weight:600;color:var(--text-light)}
.carry-hint{font-size:.72rem;color:var(--text-light);padding:0 12px 6px}
.carry-details .check-item{background:#FDF7EC}
.carry-details .check-item:hover{background:#FBEFDC}
/* 待补总览 */
.owe-box{flex:1;min-width:120px;padding:12px 14px;border-radius:var(--radius-sm);text-align:center}
.owe-words{background:#FFF1E6}
.owe-tasks{background:#EAF3FF}
.owe-num{font-size:1.6rem;font-weight:800;line-height:1.1}
.owe-words .owe-num{color:#E17055}
.owe-tasks .owe-num{color:#0984E3}
.owe-short{background:#E6FBF9}
.owe-short .owe-num{color:#00B8A9}
.owe-vlog{background:#FFF7E0}
.owe-vlog .owe-num{color:#E1A100}
.owe-label{font-size:.72rem;color:var(--text-light);margin-top:2px}
.check-item .item-text{flex:1;font-size:.9rem}
.check-item .item-meta{font-size:.72rem;color:var(--text-light);margin-top:2px}
.check-item.overdue{border-left:3px solid var(--danger)}
.check-item.carryover{border-left:3px solid var(--warning);background:#FFF9F0}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.9rem;font-family:var(--font);background:#fff;transition:border-color .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}
textarea{resize:vertical;min-height:80px}
.daily-quote{background:linear-gradient(135deg,#6C5CE7,#A29BFE);color:#fff;border-radius:var(--radius);padding:20px 24px;margin-bottom:20px;text-align:center;position:relative;overflow:hidden}
.daily-quote::before{content:'✨';position:absolute;top:8px;left:12px;font-size:1.2rem;opacity:.4}
.daily-quote .quote-text{font-size:1.05rem;font-weight:500;margin-bottom:6px}
.daily-quote .quote-author{font-size:.8rem;opacity:.85}
.pet-area{display:flex;align-items:center;gap:20px;padding:16px;background:linear-gradient(135deg,#FFF9F0,#FFF5E6);border-radius:var(--radius);margin-bottom:20px}
.pet-emoji{font-size:3.5rem;animation:petBounce 2s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.1))}
.pet-emoji.sleeping{animation:petSleep 3s ease-in-out infinite}
@keyframes petBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes petSleep{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.95) rotate(-3deg)}}
.pet-info{flex:1}
.pet-name{font-size:1rem;font-weight:700;margin-bottom:4px}
.pet-status-text{font-size:.85rem;color:var(--text-light)}
.pet-mood-bar{margin-top:8px;height:8px;background:rgba(0,0,0,.06);border-radius:4px;overflow:hidden}
.pet-mood-fill{height:100%;border-radius:4px;transition:width .5s,background .5s}
.progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.progress-card{background:var(--bg-card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center}
.progress-card .pc-icon{font-size:1.5rem;margin-bottom:6px}
.progress-card .pc-title{font-size:.8rem;color:var(--text-light);margin-bottom:4px}
.progress-card .pc-value{font-size:1.3rem;font-weight:700}
.progress-bar{height:6px;background:var(--border);border-radius:3px;margin-top:8px;overflow:hidden}
.progress-bar .pb-fill{height:100%;border-radius:3px;background:var(--primary);transition:width .5s}
.badge-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
.badge-item{text-align:center;padding:12px 6px;border-radius:var(--radius-sm);background:#F7F8FC;border:2px solid transparent;transition:all .2s}
.badge-item.earned{background:linear-gradient(135deg,#FFF9F0,#FFF0E6);border-color:var(--warning)}
.badge-item.locked{opacity:.35;filter:grayscale(1)}
.badge-item .b-icon{font-size:1.8rem}
.badge-item .b-name{font-size:.68rem;margin-top:4px;font-weight:600}
.badge-item .b-desc{font-size:.62rem;color:var(--text-light);margin-top:2px}
.day-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.day-tab{flex-shrink:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#EEF0F5;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;position:relative;border:none;color:var(--text)}
.day-tab:hover{background:var(--primary-light);color:#fff}
.day-tab.active{background:var(--primary);color:#fff}
.day-tab.today::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--danger)}
.day-tab.completed{background:#D4EDDA;color:#155724}
.day-tab.completed.active{background:var(--success);color:#fff}
.day-tab.preview{background:#FFF5E6;color:#E17055}
.day-tab.preview.active{background:#E17055;color:#fff}
.write-timer-box{display:flex;align-items:center;gap:14px;padding:16px;background:linear-gradient(135deg,#F0F4FF,#E6EFFF);border-radius:var(--radius);margin-bottom:16px;flex-wrap:wrap}
.write-timer-box .timer-display{font-size:1.6rem;font-weight:700;font-family:'SF Mono',Consolas,monospace;color:var(--primary-dark);min-width:100px}
.write-timer-box .timer-status{font-size:.8rem;color:var(--text-light)}
.write-timer-box .timer-actions{display:flex;gap:8px;margin-left:auto}
.wordcount-box{display:flex;gap:10px;align-items:end;margin-bottom:16px;flex-wrap:wrap}
.wordcount-box .wc-input-group{flex:1;min-width:140px}
.wordcount-box label{font-size:.8rem;color:var(--text-light);display:block;margin-bottom:4px}
.wordcount-result{padding:8px 14px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:600;display:inline-block;margin-top:8px}
.wordcount-result.pass{background:#D4EDDA;color:#155724}
.wordcount-result.fail{background:#F8D7DA;color:#721C24}
.sub-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--border)}
.sub-tab{padding:10px 20px;border:none;background:none;font-size:.9rem;cursor:pointer;color:var(--text-light);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;font-family:var(--font);font-weight:500}
.sub-tab:hover{color:var(--primary)}
.sub-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.learn-card{background:#F7F8FC;border-radius:var(--radius-sm);padding:14px;margin-bottom:10px}
.learn-card .lc-title{font-size:.92rem;font-weight:600;margin-bottom:6px}
.learn-card .lc-content{font-size:.82rem;color:var(--text-light);line-height:1.7}
.learn-card .lc-tag{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:4px;background:var(--primary-light);color:#fff;margin-right:4px;margin-bottom:4px}
.db-filter{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.db-filter .filter-btn{padding:5px 14px;border:1.5px solid var(--border);border-radius:16px;background:#fff;font-size:.8rem;cursor:pointer;transition:all .2s;font-family:var(--font)}
.db-filter .filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.db-entry{background:#F7F8FC;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--primary)}
.db-entry .de-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.db-entry .de-title{font-size:.88rem;font-weight:600}
.db-entry .de-date{font-size:.7rem;color:var(--text-light);white-space:nowrap}
.db-entry .de-content{font-size:.82rem;color:var(--text-light);line-height:1.6;word-break:break-all;white-space:pre-wrap}
.db-entry .de-tags{margin-top:6px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px}
.stat-box{background:#F7F8FC;border-radius:var(--radius-sm);padding:14px;text-align:center}
.stat-box .sb-value{font-size:1.5rem;font-weight:700;color:var(--primary)}
.stat-box .sb-label{font-size:.78rem;color:var(--text-light);margin-top:4px}
.chart-container{background:#fff;border-radius:var(--radius-sm);padding:14px;margin-bottom:14px;overflow-x:auto}
.chart-container .chart-title{font-size:.9rem;font-weight:600;margin-bottom:10px}
.bar-chart{display:flex;align-items:end;gap:3px;height:120px;padding-top:10px;min-width:400px;position:relative;padding-bottom:24px}
.bar-chart .bar{flex:1;min-width:12px;background:var(--primary-light);border-radius:3px 3px 0 0;position:relative;transition:height .5s;cursor:pointer;min-height:2px}
.bar-chart .bar:hover{background:var(--primary)}
.bar-chart .bar .bar-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--text-light);white-space:nowrap}
.bar-chart .bar .bar-val{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.62rem;color:var(--text);white-space:nowrap}
.cycle-banner{background:linear-gradient(135deg,#00CEC9,#00B894);color:#fff;border-radius:var(--radius);padding:14px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cycle-banner .cb-info{font-size:.85rem}
.cycle-banner .cb-info strong{font-size:1rem}
.cycle-banner .cb-day-num{font-size:2rem;font-weight:800;line-height:1}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:2000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:24px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal h3{font-size:1.1rem;margin-bottom:14px}
.modal p{font-size:.88rem;color:var(--text-light);margin-bottom:14px;line-height:1.6}
.modal .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty-state .es-icon{font-size:3rem;opacity:.3;margin-bottom:12px}
.empty-state .es-text{font-size:.9rem}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:#fff;padding:10px 24px;border-radius:24px;font-size:.85rem;z-index:3000;transition:transform .3s;white-space:nowrap;box-shadow:var(--shadow-lg);max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.warning{background:var(--warning);color:#333}
.carryover-banner{background:#FFF5E6;border:1px solid var(--warning);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:.82rem;color:#8B6914}
.carryover-banner strong{color:#E17055}
.completion-status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.completion-pill{padding:4px 12px;border-radius:12px;font-size:.78rem;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.completion-pill.pass{background:#D4EDDA;color:#155724}
.completion-pill.fail{background:#F8D7DA;color:#721C24}
.preview-banner{background:linear-gradient(135deg,#FFF5E6,#FFE8D6);border:1px solid #E17055;border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:.82rem;color:#8B4513;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media(max-width:900px){.progress-grid{grid-template-columns:1fr}}
@media(max-width:900px),all and (orientation:portrait) and (max-width:1100px){
  :root{--sidebar-w:260px}
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .main-content{margin-left:0;padding-top:56px}
  .mobile-topbar{display:flex}
  .page-container{padding:14px 12px 40px}
  .card{padding:14px}
  .pet-area{flex-direction:column;text-align:center;gap:8px}
  .pet-emoji{font-size:2.8rem}
  .badge-wall{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
  .write-timer-box{flex-direction:column;align-items:stretch}
  .write-timer-box .timer-actions{margin-left:0;justify-content:center}
  .stats-grid{grid-template-columns:1fr 1fr}
  .cycle-banner{flex-direction:column;text-align:center}
  .sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:999}
  .sidebar-overlay.show{display:block}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr}
  .wordcount-box{flex-direction:column;align-items:stretch}
  .day-tab{width:36px;height:36px;font-size:.8rem}
}
@media(min-width:901px) and (max-width:1200px) and (orientation:landscape){
  :root{--sidebar-w:220px}
  .page-container{padding:18px}
  .card{padding:16px}
  .progress-grid{grid-template-columns:repeat(3,1fr)}
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.25)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
@keyframes badgePop{0%{transform:scale(0);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.badge-pop{animation:badgePop .5s ease}
.hidden{display:none!important}
.sidebar-actions{display:flex;gap:6px;margin-bottom:8px}
.sidebar-btn{flex:1;background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.2)!important;color:var(--text-sidebar)!important;font-size:.72rem!important;padding:5px 8px!important;justify-content:center}
.sidebar-btn:hover{background:rgba(255,255,255,.18)!important;border-color:rgba(255,255,255,.4)!important}
.storage-info{font-size:.65rem;opacity:.5}
.outline-option-btn{display:block;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:all .2s;font-family:var(--font)}
.outline-option-btn:hover{border-color:var(--primary);background:#F8F7FF}
.outline-option-btn .oo-title{font-size:.9rem;font-weight:600;margin-bottom:3px}
.outline-option-btn .oo-desc{font-size:.75rem;color:var(--text-light)}
.modal .modal-actions{gap:8px}
.search-box{margin-bottom:12px}
.search-box input{background:#F7F8FC;border-color:transparent}
.search-box input:focus{background:#fff;border-color:var(--primary)}
.pet-edit-btn{background:none;border:none;color:var(--text-light);font-size:.75rem;cursor:pointer;padding:2px 6px;border-radius:4px}
.pet-edit-btn:hover{background:rgba(0,0,0,.06);color:var(--primary)}
.storage-warn{background:#FFF3F3;border:1px solid var(--danger);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:.82rem;color:var(--danger)}
.guide-section{margin-top:20px;padding:16px;background:#F7F8FC;border-radius:var(--radius);font-size:.82rem;color:var(--text-light);line-height:1.8}
.guide-section strong{color:var(--text)}

<script>
// ===== PWA 图标 =====
// 图标读取同目录下的 icon.png 文件，若不存在则使用内置 SVG 兜底
(function(){
  const iconPath='icon.png';
  const fallbackSvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6C5CE7"/><stop offset="100%" stop-color="#A29BFE"/></linearGradient></defs><rect width="512" height="512" rx="100" fill="url(#bg)"/><text x="256" y="280" text-anchor="middle" font-size="220" font-family="sans-serif" fill="#fff">✍️</text><text x="256" y="410" text-anchor="middle" font-size="64" font-family="sans-serif" font-weight="bold" fill="#fff" opacity="0.9">30</text></svg>`;

  function setupIcons(iconDataUrl){
    // Apple touch icon
    document.getElementById('appleTouchIcon').href=iconDataUrl;
    document.getElementById('svgIcon').href=iconDataUrl;
    document.getElementById('maskIcon').href=iconDataUrl;
    // Manifest
    const manifest={name:"30天创作追踪工作台",short_name:"创作追踪",description:"30天创作计划追踪工具",start_url:location.href.split('?')[0],display:"standalone",background_color:"#2D2A4A",theme_color:"#6C5CE7",orientation:"portrait",icons:[{src:iconDataUrl,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const l=document.createElement('link');l.rel='manifest';l.href=url;document.head.appendChild(l);
  }

  // 尝试加载 icon.png
  const img=new Image();
  img.onload=function(){
    // icon.png 存在，缩放到 180px（Apple touch icon）和 512px（manifest）
    const sizes=[{w:180,id:'apple'},{w:512,id:'manifest'}];
    const canvas512=document.createElement('canvas');canvas512.width=512;canvas512.height=512;
    canvas512.getContext('2d').drawImage(img,0,0,512,512);
    const dataUrl512=canvas512.toDataURL('image/png');

    const canvas180=document.createElement('canvas');canvas180.width=180;canvas180.height=180;
    canvas180.getContext('2d').drawImage(img,0,0,180,180);
    const dataUrl180=canvas180.toDataURL('image/png');

    document.getElementById('appleTouchIcon').href=dataUrl180;
    document.getElementById('svgIcon').href=dataUrl512;
    document.getElementById('maskIcon').href=dataUrl512;

    const manifest={name:"30天创作追踪工作台",short_name:"创作追踪",description:"30天创作计划追踪工具",start_url:location.href.split('?')[0],display:"standalone",background_color:"#2D2A4A",theme_color:"#6C5CE7",orientation:"portrait",icons:[{src:dataUrl512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const l=document.createElement('link');l.rel='manifest';l.href=url;document.head.appendChild(l);
  };
  img.onerror=function(){
    // 兜底：用 SVG 生成图标
    const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;
    const ctx=canvas.getContext('2d');const svgImg=new Image();
    svgImg.onload=function(){
      ctx.drawImage(svgImg,0,0);
      const dataUrl512=canvas.toDataURL('image/png');
      const c180=document.createElement('canvas');c180.width=180;c180.height=180;
      c180.getContext('2d').drawImage(canvas,0,0,180,180);
      const dataUrl180=c180.toDataURL('image/png');
      document.getElementById('appleTouchIcon').href=dataUrl180;
      document.getElementById('svgIcon').href=dataUrl512;
      document.getElementById('maskIcon').href=dataUrl512;
      const manifest={name:"30天创作追踪工作台",short_name:"创作追踪",description:"30天创作计划追踪工具",start_url:location.href.split('?')[0],display:"standalone",background_color:"#2D2A4A",theme_color:"#6C5CE7",orientation:"portrait",icons:[{src:dataUrl512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
      const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const l=document.createElement('link');l.rel='manifest';l.href=url;document.head.appendChild(l);
    };
    svgImg.src='data:image/svg+xml,'+encodeURIComponent(fallbackSvg);
  };
  img.src=iconPath;
})();

// ===== Service Worker 注册（离线可用）=====
// 先用 getRegistrations 注销任何旧版/损坏的 SW，再注册同域下的 sw.js，
// 由 sw.js 负责缓存 index.html，实现没网也能打开。
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    return Promise.all((regs||[]).map(r=>r.unregister()));
  }).then(()=>{
    return navigator.serviceWorker.register('sw.js').catch(err=>console.log('SW 注册失败（离线缓存不可用，但不影响联网使用）:',err));
  }).catch(()=>{});
}
</script>

  {tag:'结构拆解',title:'「三幕剧」短篇小说结构模板',content:'第一幕（占全文25%）：建立日常世界 → 触发事件打破平衡。第二幕（占50%）：主角应对挑战 → 危机升级 → 最低谷。第三幕（占25%）：最终对决 → 解决 → 新平衡。适合8000-12000字的短篇，每幕分别约2000-3000-2000字。'},
  {tag:'开头技巧',title:'「黄金三行」开头法',content:'第一行：制造悬念或冲突。第二行：暗示人物核心矛盾。第三行：给出一个看似解决实际加深问题的行动。案例：「我在离婚协议上签字的那天，天气预报说有雨。我没带伞。他也没带。」——用一个日常行为折射关系破裂。'},
  {tag:'人物塑造',title:'「缺点先行」人物速建法',content:'短篇篇幅有限，不要铺陈人物全貌。用1个核心缺点+1个反差行为快速立人设。如：一个贪财的中年女人，却每周给流浪猫买罐头。缺点让人物真实，反差让人物立体，600字内可完成。'},
  {tag:'冲突设计',title:'「两难抉择」冲突引擎',content:'最有效的短篇冲突是两难：主角必须在两个都有代价的选项中选择。案例：举报同事能升职，但同事是唯一帮她带孩子的朋友。两难冲突自带戏剧张力，能撑起整篇故事。'},
  {tag:'结尾技巧',title:'「反转+留白」结尾法',content:'短篇结尾需要余韵。方法：在最后200字埋一个信息反转（如：一直以为是受害者的人其实是加害者），然后用一个意象收束（如：窗台上的花终于开了），不要解释，让读者自己品味。'},
  {tag:'变现技巧',title:'短篇变现的5个热门赛道',content:'①情感婚姻类（读者基数大，共鸣强）②悬疑反转类（完读率高，易传播）③都市职场类（代入感强，广告价值高）④奇幻仙侠类（IP改编机会多）⑤现实题材类（评奖机会多）。建议先深耕1个赛道建立读者群。'},
  {tag:'平台分析',title:'主流短篇平台特点',content:'知乎盐选：偏好悬疑/反转/情感，3000-15000字，付费阅读分成。番茄小说：偏好爽文/逆袭，1-5万字，按阅读时长分成。豆瓣阅读：偏好文学性强的现实题材，5000-30000字，有评奖机会。微信公众号：偏好情感共鸣类，2000-5000字，靠流量主和打赏。'},
  {tag:'爆款规律',title:'「数据驱动」选题法',content:'不要凭感觉选题。方法：①在目标平台搜热榜关键词 ②记录前20名标题的共同元素 ③用「主角身份+核心冲突+反转点」公式拟5个选题 ④在小红书/微博搜相关话题看热度 ⑤选热度高+差异化空间大的写。'}

  {tag:'对标账号',title:'「减肥日常」题材账号方向',content:'搜索关键词：减肥日记、减肥餐、运动打卡、减脂日常。观察要点：①数据呈现（体重曲线/热量数字）②前后对比 ③食谱分享形式 ④失败/暴食的真实记录（共鸣感强）⑤系列化更新（打卡第N天）。建议关注分享过程而非只晒结果的账号。'},

function todayStr(){const d=new Date();return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`}
function parseDateStr(s){const p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)}
function formatDate(cn){const d=new Date(cn);return `${d.getMonth()+1}月${d.getDate()}日`}
function getCycleDayNum(){if(!DATA.cycle)return 0;const s=parseDateStr(DATA.cycle.startDate),t=parseDateStr(todayStr());return Math.floor((t-s)/86400000)+1}

function cycleDayNumFor(dateStr){if(!DATA.cycle)return 0;const s=parseDateStr(DATA.cycle.startDate),t=parseDateStr(dateStr);return Math.floor((t-s)/86400000)+1}
function formatDuration(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return h>0?`${h}:${m.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`:`${m.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`}

function getQuotePool(){return [...QUOTES, ...(DATA.quotes.custom||[])]}
function getDailyQuote(){
  const t=todayStr();
  if(DATA.dailyQuotes[t])return DATA.dailyQuotes[t];
  const pool=getQuotePool();
  let used=DATA.quotes.used||[];
  // 用过的不再出现，直至库耗尽再循环
  let available=pool.filter((_,i)=>!used.includes(i));
  if(available.length===0){used=[];available=pool}
  // 按日期做伪随机
  const seed=parseDateStr(t).getTime();
  const idx=seed%available.length;
  const q=available[idx];
  const realIdx=pool.indexOf(q);
  used.push(realIdx);
  if(used.length>pool.length)used=used.slice(-pool.length);
  DATA.quotes.used=used;
  DATA.dailyQuotes[t]=q;
  return q;
}

function isDayCompleted(dk){
  const nd=DATA.novel.dailyData[dk],sd=DATA.short.dailyData[dk],vd=DATA.vlog.dailyData[dk];
  let n=false,s=false,v=false;
  if(nd){n=(nd.tasks&&nd.tasks.some(t=>t))||(nd.customTasks&&nd.customTasks.some(t=>t.done))||(nd.words&&nd.words>=3300)}
  if(sd){s=(sd.writeTasks&&sd.writeTasks.some(t=>t))||(sd.learnTasks&&sd.learnTasks.some(t=>t))}
  if(vd){v=(vd.createTasks&&vd.createTasks.some(t=>t))||(vd.learnTasks&&vd.learnTasks.some(t=>t))}
  return n||s||v;
}
function getStreakDays(){if(!DATA.cycle)return 0;let s=0;const start=parseDateStr(DATA.cycle.startDate),today=parseDateStr(todayStr());for(let d=today;d>=start;d=new Date(d.getTime()-86400000)){const dn=Math.floor((d-start)/86400000)+1;if(dn<1||dn>30)break;if(isDayCompleted('day'+dn))s++;else if(dn<getCycleDayNum())break}return s}

function getPetLevelInfo(){const total=getTotalWordsAllTime();const PER=10000;const level=Math.floor(total/PER)+1;const cur=total%PER;const pct=Math.round(cur/PER*100);const need=PER-cur;return {level,total,cur,need,pct,PER}}
function updatePetActivity(){DATA.pet.lastActive=Date.now()}

/* ========== 路由 ========== */
let currentPage='progress';
function navigateTo(p){currentPage=p;document.querySelectorAll('.sidebar-nav li a').forEach(a=>a.classList.toggle('active',a.dataset.page===p));const titles={progress:'计划进度',novel:'长篇小说',short:'短篇小说',vlog:'Vlog',database:'学习归纳数据库'};document.getElementById('topbarTitle').textContent=titles[p]||p;document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('show');renderPage(p)}
document.querySelectorAll('.sidebar-nav li a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();navigateTo(a.dataset.page)}));
document.getElementById('menuBtn').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarOverlay').classList.add('show')});
document.getElementById('sidebarOverlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('show')});
function renderPage(p){const c=document.getElementById('pageContainer');c.innerHTML='';({progress:renderProgressPage,novel:renderNovelPage,short:renderShortPage,vlog:renderVlogPage,database:renderDatabasePage}[p]||renderProgressPage)(c)}

/* ========== 备注提醒 ========== */
function prevNoteReminder(type,day){if(day<=1)return '';const prevDk='day'+(day-1);let prev=null;if(type==='novel')prev=DATA.novel.dailyData[prevDk];else if(type==='short')prev=DATA.short.dailyData[prevDk];else prev=DATA.vlog.dailyData[prevDk];if(prev&&prev.note&&prev.note.trim())return `<div class="reminder-banner"><strong>📌 昨日备注提醒（Day ${day-1}）</strong><br>${escapeHtml(prev.note)}</div>`;return ''}

/* ========== 提前完成检测 ========== */
function isMainTaskDone(type){
  if(type==='novel'){const np=calcNovelProgress();return np.total>0&&np.done>=np.total}
  if(type==='short'){return calcShortProgress().done>=3}
  if(type==='vlog'){return calcVlogProgress().done>=5}
  return false;
}
function checkEarlyCompletion(){
  if(!DATA.cycle)return;
  if(DATA.cycle.completionPrompted)return;
  const n=isMainTaskDone('novel'),s=isMainTaskDone('short'),v=isMainTaskDone('vlog');
  // 三项都完成 或 当前周期天数已到30且至少完成一项
  const cd=getCycleDayNum();
  if((n&&s&&v)||(cd>=30&&(n||s||v))){
    DATA.cycle.completionPrompted=true;saveData();
    showCycleCompletionModal(n,s,v);
  }
}
function showCycleCompletionModal(n,s,v){
  const np=calcNovelProgress(),sp=calcShortProgress(),vp=calcVlogProgress();
  const tw=getTotalWordsAllTime();
  const cyc=getCyclesCompleted()+1;
  showModal(`<h3>🎉 恭喜！30天周期任务完成！</h3>
  <p>这是你的第 <strong>${cyc}</strong> 个30天周期。以下是本次周期总结：</p>
  <div style="background:#F7F8FC;border-radius:8px;padding:14px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>📖 长篇小说</span><strong>${np.done}/${np.total} 章 ${n?'✅':'❌'}</strong></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>✍️ 短篇小说</span><strong>${sp.done}/3 篇 ${s?'✅':'❌'}</strong></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>🎬 Vlog</span><strong>${vp.done}/5 条 ${v?'✅':'❌'}</strong></div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;border-top:1px solid var(--border);padding-top:8px"><span>累计创作字数</span><strong>${tw} 字</strong></div>
    <div style="display:flex;justify-content:space-between;margin-top:4px"><span>本周期获得勋章</span><strong>${DATA.badges.earned.length} 枚</strong></div>
    <div style="display:flex;justify-content:space-between;margin-top:4px"><span>跨周期勋章</span><strong>${(DATA.crossBadges.earned||[]).length} 枚</strong></div>
  </div>
  ${n&&s&&v?'<div class="carryover-banner"><strong>🌟 大满贯！</strong>三大任务全部完成！</div>':''}
  <p>是否立即归档并开启新周期？归档时未完成项会自动延续到新周期。</p>
  <div class="modal-actions">
    <button class="btn btn-outline" onclick="closeModal()">稍后再说</button>
    <button class="btn" onclick="closeModal();archiveCycle(true)">归档并开启新周期</button>
  </div>`);
}

/* ========== 页面1：计划进度 ========== */
function renderProgressPage(c){
  if(!DATA.cycle){renderNoCycleState(c);return}
  const cd=getCycleDayNum(),pet=getPetState(),q=getDailyQuote(),pl=getPetLevelInfo();
  const b=document.createElement('div');b.className='cycle-banner fade-in';
  b.innerHTML=`<div><div style="font-size:.75rem;opacity:.85">当前周期</div><strong>${DATA.cycle.title||'30天创作计划'}</strong><div class="cb-info">起始日：${formatDate(DATA.cycle.startDate)} · 已过 ${Math.min(cd,30)} / 30 天</div></div><div style="text-align:center"><div class="cb-day-num">${Math.min(cd,30)}</div><div style="font-size:.75rem;opacity:.85">Day ${Math.min(cd,30)}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"><button class="btn btn-sm btn-outline" style="background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.4)" onclick="archiveCycle(false)">归档并开启新周期</button><button class="btn btn-sm btn-outline" style="background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.4)" onclick="showArchiveModal()">📦 归档库</button></div>`;
  c.appendChild(b);
  const qb=document.createElement('div');qb.className='daily-quote fade-in';qb.innerHTML=`<div class="quote-text">${q.text}</div><div class="quote-author">${q.author}</div>`;c.appendChild(qb);
  const pb=document.createElement('div');pb.className='pet-area fade-in';pb.innerHTML=`<div class="pet-emoji ${pet.sleeping?'sleeping':''}">${pet.emoji}</div><div class="pet-info"><div class="pet-name">${escapeHtml(DATA.pet.name)}<span class="level-badge">Lv.${pl.level}</span><button class="pet-edit-btn" onclick="renamePet()">✏️</button></div><div class="pet-status-text">${pet.text}</div><div class="pet-mood-bar"><div class="pet-mood-fill" style="width:${pl.pct}%;background:${pet.color}"></div></div><div class="pet-level-info">累计创作 <b>${pl.total}</b> 字 · 距 Lv.${pl.level+1} 还需 <b>${pl.need}</b> 字</div></div>`;c.appendChild(pb);
  const pg=document.createElement('div');pg.className='progress-grid fade-in';
  const np=calcNovelProgress(),sp=calcShortProgress(),vp=calcVlogProgress();
  pg.innerHTML=`<div class="progress-card"><div class="pc-icon">📖</div><div class="pc-title">长篇小说</div><div class="pc-value">${np.done}/${np.total}</div><div style="font-size:.7rem;color:var(--text-light)">已完成章节</div><div class="progress-bar"><div class="pb-fill" style="width:${np.pct}%;background:#6C5CE7"></div></div></div><div class="progress-card"><div class="pc-icon">✍️</div><div class="pc-title">短篇小说</div><div class="pc-value">${sp.done}/${sp.total}</div><div style="font-size:.7rem;color:var(--text-light)">完成篇数</div><div class="progress-bar"><div class="pb-fill" style="width:${sp.pct}%;background:#00CEC9"></div></div></div><div class="progress-card"><div class="pc-icon">🎬</div><div class="pc-title">Vlog</div><div class="pc-value">${vp.done}/${vp.total}</div><div style="font-size:.7rem;color:var(--text-light)">完成视频</div><div class="progress-bar"><div class="pb-fill" style="width:${vp.pct}%;background:#FDCB6E"></div></div></div>`;
  c.appendChild(pg);
  // 待补总览：累计真实欠债（从源数据计算，非每日顺延列表）
  let owedWords=0, owedNovelTasks=0, owedShortTasks=0, owedVlogTasks=0;
  const elDay=Math.min(cd,30);
  for(let d=1; d<=elDay; d++){
    const dd=DATA.novel.dailyData['day'+d];
    const outline=DATA.novel.outline.find(o=>o.day===d);if(!outline)continue;
    const minW=outline.minWords||3300;
    const words=dd?dd.words||0:0;
    if(words<minW)owedWords+=(minW-words);
    if(dd&&dd.tasks)outline.tasks.forEach((t,i)=>{if(!dd.tasks[i])owedNovelTasks++});
    else owedNovelTasks+=outline.tasks.length;
    if(dd&&dd.customTasks)dd.customTasks.forEach(t=>{if(!t.done)owedNovelTasks++});
  }
  const stpls=DATA.short.writeTemplates||SHORT_WRITE_DEFAULT;
  for(let d=1; d<=elDay; d++){
    const cday=((d-1)%10)+1,tpl=stpls[cday-1]||stpls[0];
    if(!tpl||!tpl.tasks||!tpl.tasks.length)continue;
    const fd=DATA.short.dailyData['day'+d];const wt=fd?fd.writeTasks:null;
    tpl.tasks.forEach((t,i)=>{if(!(wt&&wt[i]))owedShortTasks++});
  }
  const vtpls=DATA.vlog.createTemplates||VLOG_CREATE_DEFAULT;
  for(let d=1; d<=elDay; d++){
    const cday=((d-1)%6)+1,tpl=vtpls[cday-1]||vtpls[0];
    if(!tpl||!tpl.tasks||!tpl.tasks.length)continue;
    const fd=DATA.vlog.dailyData['day'+d];const ct=fd?fd.createTasks:null;
    tpl.tasks.forEach((t,i)=>{if(!(ct&&ct[i]))owedVlogTasks++});
  }
  const od=document.createElement('div');od.className='card fade-in';
  let oh=`<div class="card-title">📥 待补总览 <span class="badge" style="background:var(--warning)">截至 Day ${elDay}</span></div>`;
  if(owedWords>0||owedNovelTasks>0||owedShortTasks>0||owedVlogTasks>0){
    oh+=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">`;
    if(owedWords>0)oh+=`<div class="owe-box owe-words"><div class="owe-num">${owedWords}</div><div class="owe-label">长篇 · 字未达标</div></div>`;
    if(owedNovelTasks>0)oh+=`<div class="owe-box owe-tasks"><div class="owe-num">${owedNovelTasks}</div><div class="owe-label">长篇 · 任务未完成</div></div>`;
    if(owedShortTasks>0)oh+=`<div class="owe-box owe-short"><div class="owe-num">${owedShortTasks}</div><div class="owe-label">短篇 · 任务未完成</div></div>`;
    if(owedVlogTasks>0)oh+=`<div class="owe-box owe-vlog"><div class="owe-num">${owedVlogTasks}</div><div class="owe-label">Vlog · 任务未完成</div></div>`;
    oh+=`</div><div style="font-size:.72rem;color:var(--text-light)">⚠️ 每日顺延任务按"最近7天"回溯，最新一天仅显示近期欠账；此处为累计真实欠债，勾选顺延任务会从对应原日期扣减。</div>`;
  }else{
    oh+=`<div class="empty-state" style="padding:16px"><div class="es-icon">✅</div><div class="es-text">太棒了！当前没有未完成的欠债</div></div>`;
  }
  od.innerHTML=oh;c.appendChild(od);
  // 勋章墙（周期 + 跨周期）
  const bc=document.createElement('div');bc.className='card fade-in';
  let bh=`<div class="card-title">🎖️ 勋章墙 <span class="badge">周期 ${DATA.badges.earned.length}/${BADGES.length}</span> <span class="badge" style="background:linear-gradient(135deg,#FDCB6E,#E17055)">跨周期 ${(DATA.crossBadges.earned||[]).length}/${CROSS_BADGES.length}</span></div>`;
  bh+=`<div style="font-size:.78rem;font-weight:600;margin-bottom:6px;color:var(--text-light)">本周期勋章（新周期清零）</div><div class="badge-wall">`;
  BADGES.forEach(b=>{const e=DATA.badges.earned.find(eb=>eb.id===b.id);bh+=`<div class="badge-item ${e?'earned':'locked'}"><div class="b-icon">${b.icon}</div><div class="b-name">${b.name}</div><div class="b-desc">${b.desc}</div></div>`});
  bh+=`</div><div style="font-size:.78rem;font-weight:600;margin:12px 0 6px;color:var(--text-light)">跨周期勋章（永久保存）</div><div class="badge-wall">`;
  CROSS_BADGES.forEach(b=>{const e=(DATA.crossBadges.earned||[]).find(eb=>eb.id===b.id);bh+=`<div class="badge-item ${e?'earned':'locked'}"><div class="b-icon">${b.icon}</div><div class="b-name">${b.name}</div><div class="b-desc">${b.desc}</div></div>`});
  bh+='</div>';bc.innerHTML=bh;c.appendChild(bc);
  // 每日总结
  const t=todayStr(),sc=document.createElement('div');sc.className='card fade-in';
  sc.innerHTML=`<div class="card-title">📝 每日总结</div><textarea id="dailySummaryInput" placeholder="今天完成了什么？有什么感悟？遇到了什么困难？明天计划怎么改进？" style="min-height:100px">${DATA.dailySummary[t]||''}</textarea><div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn btn-sm btn-outline" onclick="saveDailySummary(true)">保存到学习库</button><button class="btn btn-sm" onclick="saveDailySummary(false)">仅保存</button></div>`;
  c.appendChild(sc);
  updatePetActivity();
  checkEarlyCompletion();
}

/* 计算未完成延续项 */
function computeCarryover(){
  const co={novelCarryTasks:[],novelCarryWords:0,shortIncomplete:[],vlogIncomplete:[]};
  if(!DATA.cycle)return co;
  const today=getCycleDayNum();
  for(let d=1;d<=30;d++){
    const dk='day'+d;
    const nd=DATA.novel.dailyData[dk];
    if(nd){
      const outline=DATA.novel.outline.find(o=>o.day===d);
      if(outline&&outline.tasks.length){outline.tasks.forEach((t,i)=>{if(!nd.tasks[i]&&i<nd.tasks.length)co.novelCarryTasks.push({day:d,text:t})})}
      if(nd.customTasks)nd.customTasks.forEach(t=>{if(!t.done)co.novelCarryTasks.push({day:d,text:t.text})});
      const minW=outline?(outline.minWords||3300):3300;
      if(nd.words<minW)co.novelCarryWords+=(minW-nd.words);
    }
    // 短篇：未完成的篇目（10天一轮）
    const sd=DATA.short.dailyData[dk];
    if(sd&&!isShortDayDone(d))co.shortIncomplete.push(d);
    const vd=DATA.vlog.dailyData[dk];
    if(vd&&!isVlogDayDone(d))co.vlogIncomplete.push(d);
  }
  return co;
}
function isShortDayDone(d){const sd=DATA.short.dailyData['day'+d];if(!sd)return false;return (sd.writeTasks&&sd.writeTasks.some(t=>t))||(sd.learnTasks&&sd.learnTasks.some(t=>t))}
function isVlogDayDone(d){const vd=DATA.vlog.dailyData['day'+d];if(!vd)return false;return (vd.createTasks&&vd.createTasks.some(t=>t))||(vd.learnTasks&&vd.learnTasks.some(t=>t))}
function applyCarryover(co){
  if(co.novelCarryWords>0&&DATA.novel.dailyData['day1'])DATA.novel.dailyData['day1'].carryWords=(DATA.novel.dailyData['day1'].carryWords||0)+co.novelCarryWords;
  if(co.novelCarryTasks.length&&DATA.novel.dailyData['day1']){DATA.novel.dailyData['day1'].carryTasks=[...(DATA.novel.dailyData['day1'].carryTasks||[]),...co.novelCarryTasks.map(x=>({text:x.text,done:false}))]}
}

function calcNovelProgress(){let d=0;const t=DATA.novel.outline.length||30;for(let i=1;i<=t;i++){const dd=DATA.novel.dailyData['day'+i];if(dd&&dd.words&&dd.words>=3300)d++}return{done:d,total:t,pct:t?Math.round(d/t*100):0}}

/* ========== 长篇顺延 ========== */
function processCarryover(fromDay){
  const toDay=fromDay+1;
  if(toDay<1||toDay>30)return;
  const td=DATA.novel.dailyData['day'+toDay];
  if(!td)return;
  if(!td.carryTasks)td.carryTasks=[];
  const today=getCycleDayNum();
  const desired=[];let carryWords=0;
  const CAP=7;                                   // 顺延回溯上限：只看最近 7 天，避免任务/字数无上限膨胀
  const startD=Math.max(1, fromDay-CAP+1);
  for(let d=startD; d<=fromDay; d++){
    if(d>today)continue;
    const fd=DATA.novel.dailyData['day'+d];if(!fd)continue;
    const outline=DATA.novel.outline.find(o=>o.day===d);if(!outline)continue;
    const minW=outline.minWords||3300;
    if(fd.words<minW)carryWords+=(minW-fd.words);
    outline.tasks.forEach((t,i)=>{if(!fd.tasks[i])desired.push({srcDay:d,text:t})});
    if(fd.customTasks)fd.customTasks.forEach(t=>{if(!t.done)desired.push({srcDay:d,text:t.text})});
  }
  const existing=td.carryTasks;
  td.carryTasks=desired.map(item=>{const ex=existing.find(e=>e.srcDay===item.srcDay&&e.text===item.text);return {srcDay:item.srcDay,text:item.text,done:ex?ex.done:false}});
  td.carryWords=carryWords;saveData();
}
/* 短篇顺延：模板按"本篇第几天"(1-10)循环，无每日字数下限，仅任务顺延 */
function processCarryoverShort(fromDay){
  const toDay=fromDay+1;
  if(toDay<1||toDay>30)return;
  const td=DATA.short.dailyData['day'+toDay];
  if(!td)return;
  if(!td.carryTasks)td.carryTasks=[];
  const today=getCycleDayNum();
  const tpls=DATA.short.writeTemplates||SHORT_WRITE_DEFAULT;
  const desired=[];
  const CAP=7;
  const startD=Math.max(1, fromDay-CAP+1);
  for(let d=startD; d<=fromDay; d++){
    if(d>today)continue;
    const cday=((d-1)%10)+1;
    const tpl=tpls[cday-1]||tpls[0];
    if(!tpl||!tpl.tasks||!tpl.tasks.length)continue;
    const fd=DATA.short.dailyData['day'+d];
    const wt=fd?fd.writeTasks:null;
    tpl.tasks.forEach((t,i)=>{const done=wt&&wt[i];if(!done)desired.push({srcDay:d,text:t})});
  }
  const existing=td.carryTasks;
  td.carryTasks=desired.map(item=>{const ex=existing.find(e=>e.srcDay===item.srcDay&&e.text===item.text);return {srcDay:item.srcDay,text:item.text,done:ex?ex.done:false}});
  saveData();
}
/* Vlog顺延：模板按"本条第几天"(1-6)循环，仅任务顺延 */
function processCarryoverVlog(fromDay){
  const toDay=fromDay+1;
  if(toDay<1||toDay>30)return;
  const td=DATA.vlog.dailyData['day'+toDay];

  const startD=Math.max(1, fromDay-CAP+1);
  for(let d=startD; d<=fromDay; d++){
    if(d>today)continue;
    const cday=((d-1)%6)+1;
    const tpl=tpls[cday-1]||tpls[0];
    if(!tpl||!tpl.tasks||!tpl.tasks.length)continue;
    const fd=DATA.vlog.dailyData['day'+d];
    const ct=fd?fd.createTasks:null;
    tpl.tasks.forEach((t,i)=>{const done=ct&&ct[i];if(!done)desired.push({srcDay:d,text:t})});
  }
  const existing=td.carryTasks;
  td.carryTasks=desired.map(item=>{const ex=existing.find(e=>e.srcDay===item.srcDay&&e.text===item.text);return {srcDay:item.srcDay,text:item.text,done:ex?ex.done:false}});

function renderDbStats(c){
  const sessions=DATA.stats.writeSessions||[];
  // 范围选择
  const rs=document.createElement('div');rs.className='card fade-in';
  let rh=`<div class="card-title">📊 写作数据统计</div><div class="range-selector">`;
  ['7','14','30','all'].forEach(r=>{rh+=`<button class="filter-btn ${statsRange===r?'active':''}" onclick="statsRange='${r}';renderPage('database')">${r==='all'?'全部历史':'近'+r+'天'}</button>`});
  rh+=`<input type="number" id="customRange" placeholder="自定义天数" min="1" max="9999" value="" onchange="if(this.value){statsRange=this.value;renderPage('database')}"></div>`;
  // 统计
  let days=0;
  if(statsRange==='all')days=9999;
  else days=parseInt(statsRange)||7;
  const startDate=new Date(Date.now()-days*86400000);
  const ranged=sessions.filter(s=>parseDateStr(s.date)>=startDate);
  const todayS=sessions.filter(s=>s.date===todayStr());
  const totalWords=sessions.reduce((a,b)=>a+(b.words||0),0);
  const rangedWords=ranged.reduce((a,b)=>a+(b.words||0),0);
  const timedRanged=ranged.filter(s=>(s.duration||0)>0);
  const timedRangedWords=timedRanged.reduce((a,b)=>a+(b.words||0),0);
  const timedRangedDur=timedRanged.reduce((a,b)=>a+(b.duration||0),0);
  const avgSpeed=timedRangedDur>0?Math.round(timedRangedWords/(timedRangedDur/60)):0;
  const avgMin=timedRanged.length>0?(timedRangedDur/timedRanged.length/60).toFixed(1):0;
  rh+=`<div class="stats-grid">
    <div class="stat-box"><div class="sb-value">${todayS.length}</div><div class="sb-label">今日写作次数</div></div>
    <div class="stat-box"><div class="sb-value">${todayS.reduce((a,b)=>a+(b.words||0),0)}</div><div class="sb-label">今日字数</div></div>
    <div class="stat-box"><div class="sb-value">${ranged.length}</div><div class="sb-label">区间写作次数</div></div>
    <div class="stat-box"><div class="sb-value">${rangedWords}</div><div class="sb-label">区间字数</div></div>
    <div class="stat-box"><div class="sb-value">${totalWords}</div><div class="sb-label">累计字数（永久）</div></div>
    <div class="stat-box"><div class="sb-value">${avgSpeed}</div><div class="sb-label">平均字/分钟(仅计时)</div></div>
    <div class="stat-box"><div class="sb-value">${avgMin}</div><div class="sb-label">平均每次时长(分)</div></div>
  </div>`;
  rs.innerHTML=rh;c.appendChild(rs);
  if(sessions.length===0){const e=document.createElement('div');e.className='card fade-in';e.innerHTML='<div class="empty-state"><div class="es-icon">📊</div><div class="es-text">还没有写作记录，去长篇/短篇开始计时吧！</div></div>';c.appendChild(e);return}
  // 气泡图（几点写的/写多少）
  const bc=document.createElement('div');bc.className='chart-container fade-in';
  const maxW=Math.max(...sessions.map(s=>s.words||0),1);
  let bh=`<div class="chart-title">🕐 写作时段气泡图（横轴=小时0-23，气泡大小=字数，颜色=类型）</div><div class="bubble-legend"><span class="lg"><span class="dot" style="background:#6C5CE7"></span>长篇</span><span class="lg"><span class="dot" style="background:#00CEC9"></span>短篇</span></div><div class="bubble-chart">`;
  // 网格线
  for(let h=0;h<=24;h+=3){bh+=`<div class="hour-grid" style="left:${(h/24*100)}%"></div><span class="hour-label" style="left:${(h/24*100)}%">${h}时</span>`}
  // 气泡
  ranged.forEach((s,idx)=>{
    const hr=s.startHour||0;
    const left=(hr/24*100);
    const size=Math.max(12,Math.min(50,(s.words||0)/maxW*45+12));
    const color=s.type==='novel'?'#6C5CE7':'#00CEC9';
    const top=100-Math.min(70,(s.words||0)/maxW*60)-10;
    bh+=`<div class="bubble" style="left:${left}%;bottom:${100-top}%;width:${size}px;height:${size}px;background:${color}" title="${s.date} ${s.startTime||''} · ${s.type==='novel'?'长篇':'短篇'} · ${s.words||0}字 · ${formatDuration(s.duration||0)}"></div>`;
  });
  bh+='</div>';bc.innerHTML=bh;c.appendChild(bc);
  // 24小时柱状图
  const hc=document.createElement('div');hc.className='chart-container fade-in';
  const hourBuckets=Array(24).fill(0);
  ranged.forEach(s=>{hourBuckets[s.startHour||0]+=(s.words||0)});
  const maxHB=Math.max(...hourBuckets,1);
  let hh=`<div class="chart-title">📈 各小时写作字数（24h）</div><div class="bar-chart" style="min-width:600px">`;
  hourBuckets.forEach((w,h)=>{const pct=w>0?Math.max(3,Math.round(w/maxHB*100)):0;hh+=`<div class="bar" style="height:${pct}%" title="${h}时: ${w}字">${w>0?`<div class="bar-val">${w}</div>`:''}<div class="bar-label">${h}</div></div>`});
  hh+='</div>';hc.innerHTML=hh;c.appendChild(hc);
  // 写作记录明细（几点写、写多少）
  const tl=document.createElement('div');tl.className='card fade-in';
  const grouped={};
  ranged.slice().reverse().forEach(s=>{const gi=sessions.indexOf(s);if(!grouped[s.date])grouped[s.date]=[];grouped[s.date].push({s,gi})});
  let thtml=`<div class="card-title">📝 写作记录明细（最近在前）</div><div class="session-timeline">`;
  const dates=Object.keys(grouped).sort((a,b)=>b>a?1:-1);
  if(dates.length===0)thtml+='<div class="empty-state"><div class="es-icon">🗒️</div><div class="es-text">该区间暂无记录</div></div>';
  dates.forEach(d=>{
    thtml+=`<div class="session-day"><div class="sd-date">${d}（${grouped[d].length}次）</div>`;
    grouped[d].forEach(({s,gi})=>{
      const color=s.type==='novel'?'#6C5CE7':'#00CEC9';
      const label=s.type==='novel'?'长篇':'短篇';
      thtml+=`<div class="session-item"><span class="si-type" style="background:${color}">${label}</span><span class="si-time">${s.startTime||'--'}</span><span class="si-dur">${formatDuration(s.duration||0)}</span><span class="si-words">${s.words||0}字</span><button class="btn btn-sm btn-danger si-del" onclick="deleteSession(${gi})">删</button></div>`;
    });
    thtml+='</div>';
  });
  thtml+='</div>';tl.innerHTML=thtml;c.appendChild(tl);
}
function renderDbLibrary(c){
  // 添加新条目
  const ac=document.createElement('div');ac.className='card fade-in';
  ac.innerHTML=`<div class="card-title">➕ 添加学习内容</div><div style="margin-bottom:10px"><label style="font-size:.8rem;color:var(--text-light);display:block;margin-bottom:4px">标题</label><input type="text" id="dbNewTitle" placeholder="标题或链接说明"></div><div style="margin-bottom:10px"><label style="font-size:.8rem;color:var(--text-light);display:block;margin-bottom:4px">内容/链接</label><textarea id="dbNewContent" placeholder="粘贴链接、笔记、心得..." style="min-height:60px"></textarea></div><div style="margin-bottom:10px"><label style="font-size:.8rem;color:var(--text-light);display:block;margin-bottom:4px">分类标签（逗号分隔）</label><input type="text" id="dbNewTags" placeholder="如：短篇,结构,三幕剧"></div><div style="margin-bottom:10px"><label style="font-size:.8rem;color:var(--text-light);display:block;margin-bottom:4px">来源</label><select id="dbNewSource"><option value="manual">手动添加</option><option value="novel">长篇</option><option value="short">短篇</option><option value="vlog">Vlog</option></select></div><button class="btn" onclick="addDbEntry()">添加</button>`;
  c.appendChild(ac);
  // 分类筛选 + 搜索
  const fc=document.createElement('div');fc.className='card fade-in';
  const allTags=['all',...new Set(DATA.database.entries.flatMap(e=>e.tags||[]))];
  let fh='<div class="card-title">📚 学习归档库</div>';
  fh+=`<div class="search-box"><input type="text" placeholder="🔍 搜索标题或内容..." value="${escapeHtml(dbSearchQuery)}" oninput="dbSearchQuery=this.value;clearTimeout(window._dbSearchTimer);window._dbSearchTimer=setTimeout(()=>renderPage('database'),300)"></div>`;
  fh+='<div class="db-filter">';
  allTags.forEach(t=>{fh+=`<button class="filter-btn ${dbFilter===t?'active':''}" onclick="dbFilter='${t}';renderPage('database')">${t==='all'?'全部':escapeHtml(t)}</button>`});
  fh+='</div>';
  let filtered=dbFilter==='all'?DATA.database.entries:DATA.database.entries.filter(e=>(e.tags||[]).includes(dbFilter));
  if(dbSearchQuery.trim()){const q=dbSearchQuery.trim().toLowerCase();filtered=filtered.filter(e=>(e.title||'').toLowerCase().includes(q)||(e.content||'').toLowerCase().includes(q))}
  if(filtered.length===0)fh+='<div class="empty-state"><div class="es-icon">📂</div><div class="es-text">暂无内容，在上方添加或在其他栏目归档</div></div>';
  else{filtered.slice().reverse().forEach(e=>{fh+=`<div class="db-entry"><div class="de-header"><div class="de-title">${escapeHtml(e.title)}</div><div class="de-date">${e.date} · ${(e.source==='manual'?'手动':e.source==='novel'?'长篇':e.source==='short'?'短篇':e.source==='summary'?'总结':'Vlog')}<button class="btn btn-sm btn-danger" onclick="deleteDbEntry('${e.id}')" style="margin-left:8px;padding:2px 8px">删</button></div></div><div class="de-content">${escapeHtml(e.content)}</div><div class="de-tags">${(e.tags||[]).map(t=>`<span class="lc-tag">${escapeHtml(t)}</span>`).join('')}</div></div>`})}
  fc.innerHTML=fh;c.appendChild(fc);
}
function renderDbSummary(c){
  const sc=document.createElement('div');sc.className='card fade-in';
  let h=`<div class="card-title">📝 每日总结（跨周期累积）</div>`;
  const dates=Object.keys(DATA.dailySummary).sort((a,b)=>b>a?1:-1);
  if(dates.length===0)h+='<div class="empty-state"><div class="es-icon">📝</div><div class="es-text">暂无每日总结，去"计划进度"页面记录吧</div></div>';
  dates.forEach(d=>{
    h+=`<div class="summary-card"><div class="sc-date">${d}</div><div>${escapeHtml(DATA.dailySummary[d]||'')}</div></div>`;
  });
  sc.innerHTML=h;c.appendChild(sc);
}
function saveToDatabase(source,title,content,tags){const e={id:'db'+Date.now(),date:todayStr(),category:source,title,content,tags:tags||[],source:source==='短篇学习'?'short':source==='Vlog学习'?'vlog':'manual'};DATA.database.entries.push(e);saveData();showToast('已归档到数据库','success')}
function addDbEntry(){const title=document.getElementById('dbNewTitle').value.trim();const content=document.getElementById('dbNewContent').value.trim();const tagsRaw=document.getElementById('dbNewTags').value.trim();const source=document.getElementById('dbNewSource').value;if(!title&&!content){showToast('请输入标题或内容','warning');return}const tags=tagsRaw?tagsRaw.split(/[,，、]/).map(t=>t.trim()).filter(t=>t):[];DATA.database.entries.push({id:'db'+Date.now(),date:todayStr(),category:source,title:title||'无标题',content,tags,source});saveData();showToast('已添加','success');renderPage('database')}
function deleteDbEntry(id){DATA.database.entries=DATA.database.entries.filter(e=>e.id!==id);saveData();renderPage('database')}

/* ========== 导出/导入 ========== */
function exportData(){const blob=new Blob([JSON.stringify({data:DATA,archive:loadArchive()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`creative-tracker-${todayStr()}.json`;a.click();URL.revokeObjectURL(url);showToast('数据已导出','success')}
function exportDatabaseBackup(){const payload={type:'creative_tracker_db_backup',date:todayStr(),database:DATA.database,stats:DATA.stats,crossBadges:DATA.crossBadges,cycleRewards:DATA.cycleRewards,dailySummary:DATA.dailySummary};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`creative-tracker-db-${todayStr()}.json`;a.click();URL.revokeObjectURL(url);showToast('学习库与统计已独立导出','success')}
function importData(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const obj=JSON.parse(e.target.result);if(obj.type==='creative_tracker_db_backup'){DATA.database=obj.database||DATA.database;DATA.stats=obj.stats||DATA.stats;DATA.crossBadges=obj.crossBadges||DATA.crossBadges;DATA.cycleRewards=obj.cycleRewards||DATA.cycleRewards;DATA.dailySummary=obj.dailySummary||DATA.dailySummary;saveData();showToast('学习库与统计已导入','success');renderPage(currentPage);return}if(obj.data)DATA=obj.data;if(obj.archive)saveArchive(obj.archive);saveData();showToast('数据已导入','success');renderPage(currentPage);updateSidebarCycleInfo()}catch(err){showToast('导入失败：文件格式错误','warning')}};reader.readAsText(file)}

function renamePet(){showModal(`<h3>✏️ 给宠物改名</h3><div><label style="font-size:.85rem;display:block;margin-bottom:6px">宠物名字</label><input type="text" id="petNameInput" value="${escapeHtml(DATA.pet.name)}" placeholder="输入名字"></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn" onclick="confirmRenamePet()">确认</button></div>`);setTimeout(()=>{const inp=document.getElementById('petNameInput');if(inp){inp.focus();inp.select()}},100)}
function confirmRenamePet(){const name=document.getElementById('petNameInput').value.trim();if(name){DATA.pet.name=name;saveData();closeModal();showToast('改名成功！','success');if(currentPage==='progress')renderPage('progress')}else{showToast('名字不能为空','warning')}}
function showOutlineModal(){showModal(`<h3>导入大纲</h3><p>输入你的小说大纲，系统自动分配到30天。</p><button class="outline-option-btn" onclick="showCustomOutlineForm()"><div class="oo-title">✍️ 输入自定义大纲</div><div class="oo-desc">输入你自己的小说大纲，支持任意天数（1-30天）</div></button><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button></div>`)}
function showCustomOutlineForm(){const example='1|第一章 觉醒|主角发现异常|写开头场景;描写发现异常的细节;结尾留钩子|3300\n2|第二章 系统降临|系统出现并发布任务|写系统降临场景;主角的反应;结尾钩子|3300';showModal(`<h3>自定义大纲</h3><p style="font-size:.82rem">每行一个章节，用 <code style="background:#F0F0F4;padding:1px 4px;border-radius:3px">|</code> 分隔字段：</p><div style="font-size:.75rem;color:var(--text-light);background:#F7F8FC;padding:8px 12px;border-radius:6px;margin-bottom:12px;line-height:1.6">格式：<strong>天数|章节标题|章节描述|任务1;任务2;任务3|最低字数</strong><br>字数可省略（默认3300）</div><textarea id="customOutlineInput" placeholder="${example}" style="min-height:160px;font-size:.82rem;font-family:monospace"></textarea><div class="modal-actions"><button class="btn btn-outline" onclick="showOutlineModal()">返回</button><button class="btn" onclick="loadCustomOutline()">加载大纲</button></div>`)}
function loadCustomOutline(){const raw=document.getElementById('customOutlineInput').value.trim();if(!raw){showToast('请输入大纲内容','warning');return}const lines=raw.split('\n').filter(l=>l.trim());const outline=[];for(const line of lines){const parts=line.split('|').map(p=>p.trim());if(parts.length<4){showToast('格式错误，每行至少4个字段','warning');return}const day=parseInt(parts[0]);if(!day||day<1||day>30){showToast('天数必须1-30，错误行：'+line.substring(0,20),'warning');return}const tasks=parts[3].split(';').map(t=>t.trim()).filter(t=>t);const minWords=parts[4]?parseInt(parts[4])||3300:3300;outline.push({day,chapterTitle:parts[1],chapterDesc:parts[2],tasks,minWords})}if(!outline.length){showToast('未解析到有效大纲','warning');return}outline.sort((a,b)=>a.day-b.day);DATA.novel.outline=outline;saveData();closeModal();showToast(`已加载自定义大纲：${outline.length}章`,'success');if(currentPage==='novel')renderPage('novel')}

/* ========== 初始化 ========== */
updateSidebarCycleInfo();updateStorageUsage();autoProcessCarryover();renderPage('progress');restoreTimer();
setInterval(()=>{if(currentPage==='progress'){const p=getPetState();const el=document.querySelector('.pet-emoji');if(el)el.textContent=p.emoji}},60000);

/* ========== PWA 安装引导（iPad 优化） ========== */
let deferredPrompt=null;
const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const isIPad=/iPad|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
if(!isStandalone){
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();deferredPrompt=e;
    const btn=document.getElementById('installBtn');if(btn)btn.style.display='inline-flex';
    const tip=document.getElementById('installTip');
    if(tip)tip.textContent='点击右侧"安装"按钮，像原生App一样使用';
    setTimeout(()=>document.getElementById('installBanner').classList.add('show'),2000);
  });
  if(isIPad||isIOS){
    const tip=document.getElementById('installTip');
    const deviceName=isIPad?'iPad':'iPhone';
    if(tip)tip.innerHTML=`<b>${deviceName} 添加步骤：</b>Safari 顶部地址栏右侧点「分享」<span style="font-size:1.2rem">↗</span> →「添加到主屏幕」`;
    const btn=document.getElementById('installBtn');
    if(btn){btn.style.display='inline-flex';btn.textContent='查看教程';btn.style.background='#00CEC9'}
    setTimeout(()=>document.getElementById('installBanner').classList.add('show'),1500);
  }else{
    setTimeout(()=>{const banner=document.getElementById('installBanner');if(banner&&!banner.classList.contains('show'))banner.classList.add('show')},3000);
  }
}
document.getElementById('installBtn').addEventListener('click',()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('installBanner').classList.remove('show')});
  }else{
    const deviceName=isIPad?'iPad':(isIOS?'iPhone':'设备');
    showModal(`<h3>📱 安装到${deviceName}主屏幕</h3>
<div style="background:#F0F4FF;border-radius:12px;padding:16px;margin:12px 0;text-align:center">
  <div style="font-size:3rem;margin-bottom:8px">📲</div>
  <p style="font-weight:600;margin:0 0 12px">安装后就像原生 App 一样使用</p>
</div>
<div style="font-size:.85rem;line-height:2;color:var(--text-light)">
<strong>📱 iPad / iPhone（Safari 浏览器）</strong><br>
① 点击 Safari 地址栏右侧的 <span style="background:#E8E8ED;padding:2px 8px;border-radius:4px">分享 ↗</span> 按钮<br>
② 在弹出菜单中向下滚动，找到 <strong>「添加到主屏幕」</strong><br>
③ 点击右上角 <strong>「添加」</strong> 完成<br>
④ 回到主屏幕，点击 ✍️ 图标即可像 App 一样打开！
</div>
<div style="font-size:.85rem;line-height:2;color:var(--text-light);margin-top:12px">
<strong>💻 电脑（Chrome/Edge）</strong><br>
① 点击地址栏右侧「安装」图标<br>
② 或浏览器菜单 →「安装此应用」
</div>
<div style="font-size:.85rem;line-height:2;color:var(--text-light);margin-top:12px">
<strong>📱 安卓手机</strong><br>
① 浏览器菜单 →「添加到主屏幕」
</div>
<div class="modal-actions"><button class="btn" onclick="closeModal()">知道了</button></div>`);
  }
});
/* 横竖屏切换自适应 */
function handleOrientationChange(){const savedInputs={};document.querySelectorAll('textarea, input[type="text"], input[type="number"]').forEach(el=>{if(el.id)savedInputs[el.id]=el.value});renderPage(currentPage);Object.keys(savedInputs).forEach(id=>{const el=document.getElementById(id);if(el)el.value=savedInputs[id]})}
window.addEventListener('orientationchange',()=>setTimeout(handleOrientationChange,150));
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(handleOrientationChange,200)});
</script>
